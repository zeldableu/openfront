name = "gal-openfront"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Tag du clan interrogé.
CLAN_TAG = "GAL"

# Origines autorisées à appeler ce service, séparées par des virgules.
# Remplace par l'URL réelle du site une fois en ligne, par exemple :
#   ALLOWED_ORIGINS = "https://tonpseudo.github.io,http://localhost:5173"
# Laisser "*" fonctionne mais ouvre le service à n'importe quel site.
ALLOWED_ORIGINS = "https://zeldableu.github.io,http://localhost:5173"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

# Le refreshToken n'est PAS ici : c'est un secret, posé par la commande
#   npx wrangler secret put OF_REFRESH_TOKEN
# Ainsi il n'entre jamais dans le dépôt git.
