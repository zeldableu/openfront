name = "gal-openfront"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Tag du clan interrogé.
CLAN_TAG = "GAL"

# Origines autorisées à appeler ce service, séparées par des virgules.
# Remplace par l'URL réelle du site une fois en ligne, par exemple :
#   ALLOWED_ORIGINS = "https://tonpseudo.github.io,http://localhost:5173"
# Laisser "*" fonctionne mais ouvre le service à n'importe quel site.
ALLOWED_ORIGINS = "https://zeldableu.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Identifiant public de l'application Discord (onglet OAuth2 du portail
# développeur). Ce n'est pas un secret : il apparaît dans l'URL de
# connexion que voit l'utilisateur.
DISCORD_CLIENT_ID = "1533820385059930163"

# Identifiant du compte Cloudflare (public : pas un secret, juste un ID).
# Nécessaire pour appeler l'API Cloudflare depuis /admin/update-token.
CF_ACCOUNT_ID = "dfad3f36b3b1d60476625fa10b3f1e9c"
CF_SCRIPT_NAME = "gal-openfront"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

# Aucun secret ici : le dépôt est public. Ils sont posés par
#   npx wrangler secret put OF_REFRESH_TOKEN       compte de service OpenFront
#   npx wrangler secret put DISCORD_CLIENT_SECRET  application Discord
#   npx wrangler secret put SESSION_SECRET         signature des sessions
#   npx wrangler secret put ADMIN_PASSWORD         accès à la fenêtre admin
#   npx wrangler secret put CF_API_TOKEN            mise à jour du secret partagé
